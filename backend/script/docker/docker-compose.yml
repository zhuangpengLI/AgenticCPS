name: qiji-system

services:
  mysql:
    container_name: qiji-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql:/var/lib/mysql/
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    container_name: qiji-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    container_name: qiji-server
    build:
      context: ./backend
    image: qiji-server:local
    restart: unless-stopped
    ports:
      - "${SERVER_HOST_PORT:-48080}:48080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MASTER_DATASOURCE_URL: ${MASTER_DATASOURCE_URL}
      MASTER_DATASOURCE_USERNAME: ${MYSQL_USER}
      MASTER_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SLAVE_DATASOURCE_URL: ${SLAVE_DATASOURCE_URL:-${MASTER_DATASOURCE_URL}}
      SLAVE_DATASOURCE_USERNAME: ${MYSQL_USER}
      SLAVE_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: qiji-redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 外部 MCP 只在应用就绪后异步初始化，避免远程 SSE 阻塞 Java 包启动。
      AI_MCP_CLIENT_ENABLED: ${AI_MCP_CLIENT_ENABLED:-true}
      AI_MCP_CLIENT_TOOLCALLBACK_ENABLED: ${AI_MCP_CLIENT_TOOLCALLBACK_ENABLED:-false}
      HAINA_MCP_ENABLED: ${HAINA_MCP_ENABLED:-true}
      ARGS: ${JAVA_ARGS:-}
    volumes:
      # 制品从部署目录直接挂载，替换 JAR 后无需重新上传镜像。
      - ./backend/qiji-server.jar:/opt/qiji-server/app.jar:ro
      - server-logs:/opt/qiji-server/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    container_name: qiji-admin
    build:
      context: ./frontend
    image: qiji-admin:local
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-8080}:80"
    volumes:
      # 前端构建目录从部署目录直接挂载，上传新页面后重建容器即可生效。
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  server-logs:
    driver: local
