--- #################### AgenticCPS相关配置 ####################

# AgenticCPS配置项，设置当前项目所有自定义的配置
qiji:
  captcha:
    enable: false # 本地环境，暂时关闭图片验证码，方便登录等接口的测试；
  security:
    mock-enable: true
  ai:
    mcp:
      loopback-client:
        enabled: true
        connection-name: cps
      self-test:
        enabled: ${AI_MCP_SELF_TEST_ENABLED:false}
        client-name: ${AI_MCP_SELF_TEST_CLIENT_NAME:}
        base-url: ${AI_MCP_SELF_TEST_BASE_URL:http://127.0.0.1:48080}
        endpoint: ${AI_MCP_SELF_TEST_ENDPOINT:/mcp/cps}
        connect-timeout: ${AI_MCP_SELF_TEST_CONNECT_TIMEOUT:5s}
        read-timeout: ${AI_MCP_SELF_TEST_READ_TIMEOUT:30s}
        ttl: ${AI_MCP_SELF_TEST_TTL:60s}
        secret: ${AI_MCP_SELF_TEST_SECRET:}
  pay:
    order-notify-url: https://yutou.mynatapp.cc/admin-api/pay/notify/order # 支付渠道的【支付】回调地址
    refund-notify-url: https://yutou.mynatapp.cc/admin-api/pay/notify/refund # 支付渠道的【退款】回调地址
    transfer-notify-url: https://yutou.mynatapp.cc/admin-api/pay/notify/transfer # 支付渠道的【转账】回调地址
  access-log: # 访问日志的配置项
    enable: false
  demo: false # 关闭演示模式
  cps:
    taobao:
      app-key: your_taobao_app_key
      app-secret: your_taobao_app_secret
      default-adzone-id: your_taobao_adzone_id
    jingdong:
      app-key: your_jd_app_key
      app-secret: your_jd_app_secret
      default-adzone-id: your_jd_adzone_id
    pinduoduo:
      client-id: your_pdd_client_id
      client-secret: your_pdd_client_secret
      default-pid: your_pdd_pid
    search:
      parallel-timeout: 5
      default-page-size: 20
  wxa-code:
    env-version: develop # 小程序版本: 正式版为 "release"；体验版为 "trial"；开发版为 "develop"
  wxa-subscribe-message:
    miniprogram-state: developer # 跳转小程序类型：开发版为 “developer”；体验版为 “trial”为；正式版为 “formal”
  tencent-lbs-key: TVDBZ-TDILD-4ON4B-PFDZA-RNLKH-VVF6E # QQ 地图的密钥 https://lbs.qq.com/service/staticV2/staticGuide/staticDoc

