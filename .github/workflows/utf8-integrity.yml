name: UTF-8 Integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  utf8-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Check source-file encoding
        run: python script/check_utf8_integrity.py

      - name: Test UTF-8 integrity checker
        run: python -m pytest script/test/test_check_utf8_integrity.py
